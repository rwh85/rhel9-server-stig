#version=RHEL9
# =============================================================================
# Cypher — RHEL 9 Server STIG-Compliant Kickstart Template
# =============================================================================
# Headless infrastructure server. Provisions with:
#   - FIPS 140-3 mode enabled (CAT I — V-257844)
#   - LUKS full-disk encryption (CAT I — V-257843)
#   - OpenSCAP stig profile (NOT stig_gui — headless)
#   - Minimal package selection (no GUI)
#   - Server-optimized partition layout (large /var, /var/lib/docker)
#
# USAGE:
#   Replace CHANGEME values before use.
# =============================================================================

# --- System Configuration ---
text
skipx
lang en_US.UTF-8
keyboard us
timezone America/Denver --utc
rootpw --iscrypted CHANGEME_ROOT_PASSWORD_HASH

# Admin user (STIG requires disabling direct root SSH)
user --name=stigadmin --groups=wheel --iscrypted --password=CHANGEME_USER_PASSWORD_HASH

# --- Network ---
network --bootproto=dhcp --device=link --activate --onboot=on
network --hostname=cypher-server-01

# --- Security ---
fips --enable
selinux --enforcing
firewall --enabled --ssh

# --- Disk Layout ---
# Server-optimized: large /var (repos), dedicated /var/lib/docker
# Minimum disk: ~120 GB
#
# STIG-REQUIRED PARTITIONS:
#   /home, /tmp, /var, /var/log, /var/log/audit, /var/tmp
ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel --drives=sda

part /boot --fstype=xfs --size=1024 --ondisk=sda
part /boot/efi --fstype=efi --size=600 --ondisk=sda

# Encrypted physical volume
part pv.01 --size=1 --grow --ondisk=sda --encrypted --luks-version=luks2 \
  --passphrase=CHANGEME_LUKS_PASSPHRASE --cipher=aes-xts-plain64 --key-size=512

volgroup vg_root pv.01

logvol /              --vgname=vg_root --name=lv_root         --fstype=xfs --size=20480
logvol /home          --vgname=vg_root --name=lv_home         --fstype=xfs --size=5120
logvol /tmp           --vgname=vg_root --name=lv_tmp          --fstype=xfs --size=5120
logvol /var           --vgname=vg_root --name=lv_var          --fstype=xfs --size=40960   # Large — repos
logvol /var/log       --vgname=vg_root --name=lv_varlog       --fstype=xfs --size=10240
logvol /var/log/audit --vgname=vg_root --name=lv_varlogaudit  --fstype=xfs --size=5120
logvol /var/tmp       --vgname=vg_root --name=lv_vartmp       --fstype=xfs --size=2048
logvol /var/lib/docker --vgname=vg_root --name=lv_docker      --fstype=xfs --size=20480   # Docker
logvol swap           --vgname=vg_root --name=lv_swap         --fstype=swap --size=4096

# --- Bootloader ---
bootloader --location=mbr --append="fips=1 audit=1 audit_backlog_limit=8192"

# --- OpenSCAP STIG Profile (headless — NOT stig_gui) ---
%addon org_fedora_oscap
  content-type = scap-security-guide
  profile = xccdf_org.ssgproject.content_profile_stig
%end

# --- Package Selection (minimal, no GUI) ---
%packages
@^minimal-environment
@core
aide
audit
chrony
createrepo
firewalld
fapolicyd
httpd
libreswan
opensc
openscap
openscap-scanner
rsyslog
scap-security-guide
tmux
usbguard
yum-utils
-telnet
-rsh
-tftp
-vsftpd
-sendmail
%end

# --- Post-Install ---
%post --log=/root/cypher-kickstart-post.log
#!/bin/bash
set -euo pipefail

echo "=== Cypher Server Post-Install ==="

# Initialize AIDE database
aide --init
mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz

# Enable services
systemctl enable auditd firewalld chronyd fapolicyd usbguard rsyslog httpd

# Set default target to multi-user (headless)
systemctl set-default multi-user.target

# Set DoD banner
cat > /etc/issue << 'BANNER'
You are accessing a U.S. Government (USG) Information System (IS) that is
provided for USG-authorized use only. By using this IS, you consent to
monitoring, interception, and search. See User Agreement for details.
BANNER
cp /etc/issue /etc/issue.net
cp /etc/issue /etc/motd

# Set crypto policy
update-crypto-policies --set FIPS 2>/dev/null || true

# Generate USBGuard policy
usbguard generate-policy > /etc/usbguard/rules.conf 2>/dev/null || true

# Disable wireless/bluetooth
cat > /etc/modprobe.d/cypher-wireless.conf << 'EOF'
install iwlwifi /bin/false
install iwlmvm /bin/false
install cfg80211 /bin/false
blacklist iwlwifi
blacklist iwlmvm
EOF

cat > /etc/modprobe.d/cypher-bluetooth.conf << 'EOF'
install bluetooth /bin/false
blacklist bluetooth
EOF

# Create repo directory structure
mkdir -p /var/repos/rhel9/{BaseOS,AppStream,extras}

# Install guest agent if available
dnf install -y qemu-guest-agent 2>/dev/null && systemctl enable qemu-guest-agent || true

echo "=== Cypher Server Post-Install Complete ==="
echo "NEXT STEPS:"
echo "  1. Set GRUB password: grub2-mkpasswd-pbkdf2"
echo "  2. Run Ansible hardening playbook"
echo "  3. Configure deploy-time variables (NTP, DNS, syslog)"
%end

reboot --eject
