---
- name: restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
    use: service  # auditd requires 'service', not systemctl

- name: reload firewalld
  ansible.builtin.service:
    name: firewalld
    state: reloaded

- name: rebuild grub
  ansible.builtin.command:
    cmd: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true

- name: reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false

- name: reboot required
  ansible.builtin.debug:
    msg: "FIPS mode enabled — reboot required for activation"

- name: rebuild aliases
  ansible.builtin.command:
    cmd: newaliases
  changed_when: true

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: restart chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: restart networkmanager
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
