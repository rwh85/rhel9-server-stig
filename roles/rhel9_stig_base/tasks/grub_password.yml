---
# =============================================================================
# GRUB Bootloader Password — STIG V2R6
# =============================================================================
# Deploy-time variable: stig_grub_password_hash
# When set, configures GRUB superuser + password to prevent unauthorized
# kernel parameter changes at boot.
# Burns 2 CAT I rules: grub2_admin_username, grub2_password
#
# Generate hash: grub2-setpassword
#   or: grub2-mkpasswd-pbkdf2 (then copy the hash)
# =============================================================================

- name: GRUB password — skip if stig_grub_password_hash not defined
  ansible.builtin.debug:
    msg: "stig_grub_password_hash is empty — skipping GRUB password configuration"
  when: stig_grub_password_hash | length == 0

- name: Configure GRUB bootloader password
  when: stig_grub_password_hash | length > 0
  block:
    - name: Deploy GRUB superuser + password (V-257933 CAT I)
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          # STIG — GRUB bootloader password
          # Managed by Ansible — do not edit manually
          # Satisfies: grub2_admin_username, grub2_password
          cat << 'EOF'
          set superusers="{{ stig_grub_superuser }}"
          password_pbkdf2 {{ stig_grub_superuser }} {{ stig_grub_password_hash }}
          EOF
        dest: /etc/grub.d/01_users
        owner: root
        group: root
        mode: "0755"
      notify: rebuild grub
