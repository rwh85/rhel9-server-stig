---
# =============================================================================
# Audit & Logging — STIG V2R6 (Server/Headless)
# =============================================================================

# --- auditd.conf ---

- name: Set auditd max_log_file (V-257855)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?max_log_file\s*='
    line: "max_log_file = {{ cypher_auditd_max_log_file }}"
    state: present
  notify: restart auditd

- name: Set auditd num_logs (V-257856)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?num_logs\s*='
    line: "num_logs = {{ cypher_auditd_num_logs }}"
    state: present
  notify: restart auditd

- name: Set auditd space_left_action (V-257857)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?space_left_action\s*='
    line: "space_left_action = {{ cypher_auditd_space_left_action }}"
    state: present
  notify: restart auditd

- name: Set auditd admin_space_left_action (V-257858)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?admin_space_left_action\s*='
    line: "admin_space_left_action = {{ cypher_auditd_admin_space_left_action }}"
    state: present
  notify: restart auditd

- name: Set auditd disk_full_action (V-257859)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?disk_full_action\s*='
    line: "disk_full_action = halt"
    state: present
  notify: restart auditd

- name: Set auditd disk_error_action (V-257860)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?disk_error_action\s*='
    line: "disk_error_action = halt"
    state: present
  notify: restart auditd

- name: Set auditd space_left percentage
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?space_left\s*='
    line: "space_left = 25%"
    state: present
  notify: restart auditd

- name: Set auditd admin_space_left percentage
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?admin_space_left\s*='
    line: "admin_space_left = 10%"
    state: present
  notify: restart auditd

- name: Set auditd name_format to hostname
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?name_format\s*='
    line: "name_format = hostname"
    state: present
  notify: restart auditd

- name: Set auditd freq to 50
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^(#\s*)?freq\s*='
    line: "freq = 50"
    state: present
  notify: restart auditd

# --- Enable auditd ---

- name: Enable and start auditd service
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

# --- Audit Rules ---

- name: Create audit rules directory
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy STIG audit rules (V-257862)
  ansible.builtin.copy:
    content: |
      ## STIG Audit Rules — RHEL 9 Server V2R6
      ## Managed by Ansible — do not edit manually

      # ===== File Deletion Events =====
      -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -k delete

      # ===== Privileged Command Execution =====
      -a always,exit -F path=/usr/bin/su -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
      -a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
      -a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
      -a always,exit -F path=/usr/bin/chsh -F perm=x -F auid>=1000 -F auid!=unset -k privileged-chsh
      -a always,exit -F path=/usr/bin/crontab -F perm=x -F auid>=1000 -F auid!=unset -k privileged-crontab
      -a always,exit -F path=/usr/bin/gpasswd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-gpasswd
      -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k privileged-kmod
      -a always,exit -F path=/usr/bin/mount -F perm=x -F auid>=1000 -F auid!=unset -k privileged-mount
      -a always,exit -F path=/usr/bin/newgrp -F perm=x -F auid>=1000 -F auid!=unset -k privileged-newgrp
      -a always,exit -F path=/usr/bin/passwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-passwd
      -a always,exit -F path=/usr/sbin/postdrop -F perm=x -F auid>=1000 -F auid!=unset -k privileged-postdrop
      -a always,exit -F path=/usr/sbin/postqueue -F perm=x -F auid>=1000 -F auid!=unset -k privileged-postqueue
      -a always,exit -F path=/usr/bin/ssh-agent -F perm=x -F auid>=1000 -F auid!=unset -k privileged-ssh-agent
      -a always,exit -F path=/usr/libexec/openssh/ssh-keysign -F perm=x -F auid>=1000 -F auid!=unset -k privileged-ssh-keysign
      -a always,exit -F path=/usr/bin/sudoedit -F perm=x -F auid>=1000 -F auid!=unset -k privileged-sudoedit
      -a always,exit -F path=/usr/bin/umount -F perm=x -F auid>=1000 -F auid!=unset -k privileged-umount
      -a always,exit -F path=/usr/sbin/unix_chkpwd -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix_chkpwd
      -a always,exit -F path=/usr/sbin/unix_update -F perm=x -F auid>=1000 -F auid!=unset -k privileged-unix_update
      -a always,exit -F path=/usr/sbin/userhelper -F perm=x -F auid>=1000 -F auid!=unset -k privileged-userhelper
      -a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000 -F auid!=unset -k privileged-usermod

      # ===== Permission Modification =====
      -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -k perm_mod
      -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid=0 -k perm_mod
      -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid=0 -k perm_mod

      # ===== Unsuccessful File Access =====
      -a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b64 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -k access
      -a always,exit -F arch=b32 -S creat,open,openat,open_by_handle_at,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -k access

      # ===== Mount/Unmount =====
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -k privileged-mount
      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -k privileged-mount
      -a always,exit -F arch=b64 -S umount2 -F auid>=1000 -F auid!=unset -k privileged-mount
      -a always,exit -F arch=b32 -S umount2 -F auid>=1000 -F auid!=unset -k privileged-mount

      # ===== Login/Logout =====
      -w /var/log/lastlog -p wa -k logins
      -w /var/run/faillock -p wa -k logins
      -w /var/log/wtmp -p wa -k logins
      -w /var/log/btmp -p wa -k logins
      -w /var/log/tallylog -p wa -k logins

      # ===== Network Configuration =====
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/hostname -p wa -k system-locale
      -w /etc/NetworkManager/ -p wa -k system-locale

      # ===== Sudoers =====
      -w /etc/sudoers -p wa -k actions
      -w /etc/sudoers.d/ -p wa -k actions

      # ===== User/Group Modification =====
      -w /etc/group -p wa -k identity
      -w /etc/passwd -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity

      # ===== Kernel Module Loading =====
      -a always,exit -F arch=b64 -S init_module -F auid>=1000 -F auid!=unset -k module_chng
      -a always,exit -F arch=b64 -S finit_module -F auid>=1000 -F auid!=unset -k module_chng
      -a always,exit -F arch=b64 -S delete_module -F auid>=1000 -F auid!=unset -k module_chng
      -a always,exit -F arch=b32 -S init_module -F auid>=1000 -F auid!=unset -k module_chng
      -a always,exit -F arch=b32 -S finit_module -F auid>=1000 -F auid!=unset -k module_chng
      -a always,exit -F arch=b32 -S delete_module -F auid>=1000 -F auid!=unset -k module_chng
      -w /usr/bin/kmod -p x -k modules

      # ===== System Shutdown =====
      -a always,exit -F path=/usr/sbin/init -F perm=x -F auid>=1000 -F auid!=unset -k privileged-init
      -a always,exit -F path=/usr/sbin/poweroff -F perm=x -F auid>=1000 -F auid!=unset -k privileged-poweroff
      -a always,exit -F path=/usr/sbin/reboot -F perm=x -F auid>=1000 -F auid!=unset -k privileged-reboot
      -a always,exit -F path=/usr/sbin/shutdown -F perm=x -F auid>=1000 -F auid!=unset -k privileged-shutdown
      -w /usr/lib/systemd/system/halt.service -p wa -k session
      -w /usr/lib/systemd/system/poweroff.service -p wa -k session

      # ===== Cron =====
      -w /etc/crontab -p wa -k cron
      -w /etc/cron.d/ -p wa -k cron
      -w /etc/cron.daily/ -p wa -k cron
      -w /etc/cron.hourly/ -p wa -k cron
      -w /etc/cron.monthly/ -p wa -k cron
      -w /etc/cron.weekly/ -p wa -k cron
      -w /var/spool/cron -p wa -k cron

      # ===== SELinux Commands =====
      -a always,exit -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
      -a always,exit -F path=/usr/sbin/semanage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
      -a always,exit -F path=/usr/sbin/setfiles -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change
      -a always,exit -F path=/usr/sbin/setsebool -F perm=x -F auid>=1000 -F auid!=unset -k privileged-priv_change

      # ===== ACL Commands =====
      -a always,exit -F path=/usr/bin/chacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng
      -a always,exit -F path=/usr/bin/setfacl -F perm=x -F auid>=1000 -F auid!=unset -k perm_chng

      # ===== Delete syscalls =====
      -a always,exit -F arch=b64 -S rmdir -F auid>=1000 -F auid!=unset -k delete
      -a always,exit -F arch=b32 -S rmdir -F auid>=1000 -F auid!=unset -k delete

      # ===== SUID/SGID Privilege Function Auditing =====
      -a always,exit -F arch=b64 -S setuid -F a0=0 -F exe=/usr/sbin/unix_chkpwd -F key=privileged-unix-update
      -a always,exit -F arch=b64 -S setuid -F a0=0 -F exe=/usr/sbin/userhelper -F key=privileged-unix-update
      -a always,exit -F arch=b64 -S setuid -F a0=0 -F exe=/usr/bin/sudo -F key=privileged-unix-update
      -a always,exit -F arch=b32 -S setuid -F a0=0 -F exe=/usr/sbin/unix_chkpwd -F key=privileged-unix-update
      -a always,exit -F arch=b32 -S setuid -F a0=0 -F exe=/usr/sbin/userhelper -F key=privileged-unix-update
      -a always,exit -F arch=b32 -S setuid -F a0=0 -F exe=/usr/bin/sudo -F key=privileged-unix-update
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k setuid_privilege_function
      -a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0 -k setgid_privilege_function
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k setuid_privilege_function
      -a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0 -k setgid_privilege_function

      # ===== pam_timestamp_check =====
      -a always,exit -F path=/usr/sbin/pam_timestamp_check -F perm=x -F auid>=1000 -F auid!=unset -k privileged-pam_timestamp_check

      # ===== Immutable (MUST be last) =====
      {% if cypher_auditd_immutable | bool %}
      -e 2
      {% endif %}
    dest: /etc/audit/rules.d/cypher-stig.rules
    owner: root
    group: root
    mode: "0640"
  notify: restart auditd

# --- Remote Syslog ---

- name: Configure rsyslog remote forwarding (V-257863)
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\*\.\* @@'
    line: "*.* @@{{ cypher_remote_syslog_server }}"
    state: present
  when:
    - cypher_remote_syslog_enabled | bool
    - cypher_remote_syslog_server | length > 0
