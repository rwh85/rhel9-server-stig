[stig_auth_logon_success_cisco]
search = index=network sourcetype IN (cisco:ios,cisco:asa,cisco:nxos) ("LOGIN_SUCCESS" OR "%SEC_LOGIN-5-LOGIN_SUCCESS" OR "%ASA-6-605005" OR "%ASA-6-611101" OR "%ASA-6-113004" OR "authentication success") \
  | rex "(?:[Uu]ser[: ]+|by user |user ')(?<user>[\\w\\.\\-\\\\]+)" \
  | eval event_category="Authentication", event_action="Logon", source_type="cisco", outcome="success", source_host=coalesce(host,dvc_name,host_name), user=coalesce(user,"unknown"), details=_raw \
  | table _time, event_category, event_action, source_host, source_type, outcome, user, details
disabled = 1
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = STIG: successful logon events on Cisco devices (Authentication)

