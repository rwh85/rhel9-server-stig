# Merged from searches_linux.conf, searches_cisco.conf, searches_paloalto.conf — see _build/ for per-source indexes
# Do not edit by hand — regenerate by concatenating the three source files in _build/.
# Stanza order: linux (55), cisco (29), paloalto (33) = 117 total.

[stig_sro_create_success_linux]
search = index=os_linux sourcetype=auditd type=SYSCALL (syscall=creat OR syscall=openat OR syscall=open) success=yes \
  | rex "key=\"?(?<audit_key>[\\w\\-]+)\"?" \
  | rex "name=\"?(?<path>[^\\s\"]+)\"?" \
  | rex "exe=\"(?<exe>[^\"]+)\"" \
  | rex "auid=(?<auid>\\d+)" \
  | eval event_category="SRO", event_action="Create", source_type="linux", outcome="success", source_host=coalesce(host,src), user=coalesce(user,acct,name,src_user,"unknown"), details=coalesce(path,exe,_raw) \
  | table _time, event_category, event_action, source_host, source_type, outcome, user, details
disabled = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = STIG: successful file create syscalls on RHEL9 (SRO)

[stig_sro_create_failure_linux]
search = index=os_linux sourcetype=auditd type=SYSCALL (syscall=creat OR syscall=openat OR syscall=open) success=no \
  | rex "key=\"?(?<audit_key>[\\w\\-]+)\"?" \
  | rex "name=\"?(?<path>[^\\s\"]+)\"?" \
  | rex "exe=\"(?<exe>[^\"]+)\"" \
  | eval event_category="SRO", event_action="Create", source_type="linux", outcome="failure", source_host=coalesce(host,src), user=coalesce(user,acct,name,src_user,"unknown"), details=coalesce(path,exe,_raw) \
  | table _time, event_category, event_action, source_host, source_type, outcome, user, details
disabled = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
description = STIG: failed file create syscalls on RHEL9 (SRO)

